name: Play verification static tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.host.name }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host:
          - name: Windows PowerShell 5.1
            executable: powershell.exe
          - name: PowerShell 7.x
            executable: pwsh.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Play verification fixtures and contracts
        shell: pwsh
        run: |
          & '${{ matrix.host.executable }}' -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1
          & '${{ matrix.host.executable }}' -NoProfile -ExecutionPolicy Bypass -File .\tests\installer-tests.ps1

      - name: Verify checkout remained unchanged
        shell: pwsh
        run: |
          git diff --exit-code
          $status = @(git status --short --untracked-files=all)
          if ($status.Count -ne 0) {
            $status | Write-Host
            throw "Play verification tests changed the checkout."
          }
